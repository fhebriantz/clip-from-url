<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clip-from-url</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>clip<span>-from-</span>url</h1>
  <div id="status" class="status"></div>
</header>

<main>
  <section class="card">
    <h2>AI Auto-Highlighting</h2>
    <p class="hint">Tempel URL YouTube atau TikTok. Gemini memilih momen terbaik, FFmpeg memotongnya.</p>

    <form id="form">
      <label>URL video
        <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." required>
      </label>

      <div class="row">
        <label>Jumlah klip
          <input id="count" type="number" value="3" min="1" max="10">
        </label>
        <label>Durasi per klip (detik)
          <input id="duration" type="number" value="15" min="3" max="90">
        </label>
      </div>

      <label class="check">
        <input id="vertical" type="checkbox" checked>
        <span>Crop otomatis ke 9:16 (1080x1920)</span>
      </label>

      <button id="submit" type="submit">Proses</button>
      <div id="formError" class="error"></div>
    </form>
  </section>

  <section>
    <h2 class="section-title">Riwayat</h2>
    <div id="jobs" class="jobs"><p class="empty">Belum ada job.</p></div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
