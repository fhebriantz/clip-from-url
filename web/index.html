<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clip-from-url</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>clip<span>-from-</span>url</h1>
  <div id="status" class="status"></div>
</header>

<main>
  <section class="card">
    <h2>URL produk jadi video</h2>
    <p class="hint">Tempel URL produk Shopee atau Tokopedia. Gambar dan deskripsi diambil otomatis,
      Gemini menulis naskahnya, lalu dibacakan dan disusun jadi video vertikal 9:16.</p>

    <form id="formProduct">
      <label>URL produk
        <input id="pUrl" type="url" required
               placeholder="https://shopee.co.id/product/... atau https://www.tokopedia.com/...">
      </label>
      <div class="row">
        <label>Target durasi (detik)
          <input id="pDuration" type="number" value="30" min="15" max="60">
        </label>
        <label>Suara narator
          <select id="pVoice">
            <option value="pria">Pria (Ardi)</option>
            <option value="wanita">Wanita (Gadis)</option>
          </select>
        </label>
      </div>
      <button type="submit">Buat video</button>
      <div class="error" data-err="product"></div>
    </form>
  </section>

  <section>
    <h2 class="section-title">Riwayat</h2>
    <div id="jobs" class="jobs"><p class="empty">Belum ada job.</p></div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
