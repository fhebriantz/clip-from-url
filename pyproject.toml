[project]
name = "clip-from-url"
version = "0.1.0"
description = "Local tool: turn Shopee/Tokopedia product URLs into vertical promo videos"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "google-genai>=0.8",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "edge-tts>=7.2.8",
    "python-multipart>=0.0.32",
    "qrcode>=8.2",
]

[tool.uv]
package = false
